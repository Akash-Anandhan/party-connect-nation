name: Deploy to GitHub Pages

on:
  push:
    branches: [main, Akash]
  # Allow manually re-deploying without pushing
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish a Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Never deploy twice for the same branch
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Tells vite.config.ts to emit a fully static site (no Nitro/server)
      # instead of a Cloudflare worker.
      GH_PAGES: "1"
      # Custom domain: the site is served from the root, so build with base "/".
      # Set back to "0" to revert to the /<repo>/ project-site base.
      CUSTOM_DOMAIN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

      - name: Publish SPA shell as index.html + 404.html
        run: node scripts/static-fallback.mjs

      - name: Verify the build output
        run: |
          test -f dist/client/index.html || { echo "missing dist/client/index.html"; exit 1; }
          test -f dist/client/404.html || { echo "missing dist/client/404.html"; exit 1; }
          echo "OK — output:"
          ls -la dist/client

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
